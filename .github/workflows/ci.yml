name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Read-only token: the pipeline only builds and tests.
permissions:
  contents: read

# A newer push to the same branch makes the older run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-services:
    name: Java Services Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Every suite runs in full. The Spring context tests use a hermetic "test" profile
      # (src/test/resources/application-test.properties), so no database, broker or registry is needed.
      - name: Test Orchestrator
        run: mvn -B test --file services/orchestrator/pom.xml

      - name: Test CMS Adapter
        run: mvn -B test --file services/cms-adapter/pom.xml

      - name: Test Legacy CMS
        run: mvn -B test --file legacy/cms/pom.xml

  python-services:
    name: Python Services Syntax & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Same minor version as the service Dockerfiles (python:3.11-slim).
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            services/wms-adapter/app/requirements.txt
            services/ros-integration/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/wms-adapter/app/requirements.txt
          pip install -r services/ros-integration/requirements.txt

      - name: Syntax verification (compileall)
        run: python -m compileall -q services/wms-adapter services/ros-integration

      - name: Run Python unit tests
        env:
          DEDUP_DB_PATH: ':memory:'
        run: |
          python -m unittest discover -s services/wms-adapter/test -p "test_*.py"
          python -m unittest discover -s services/ros-integration/test -p "test_*.py"

  frontend-ui:
    name: Frontend UI Build & Test
    runs-on: ubuntu-latest
    env:
      # CI=true makes Create React App treat ESLint warnings as build errors and run Jest non-interactively.
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 with npm caching
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ui/client-portal/package-lock.json
            ui/driver-app/package-lock.json

      - name: Install, build and test Client Portal
        working-directory: ui/client-portal
        run: |
          npm ci
          npm run build
          npm test -- --watchAll=false

      - name: Install, build and test Driver App
        working-directory: ui/driver-app
        run: |
          npm ci
          npm run build
          npm test -- --watchAll=false

  docker-compose-check:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment files
        run: |
          for f in services/orchestrator services/cms-adapter services/ros-integration services/wms-adapter/app; do
            if [ -f "$f/.env.example" ] && [ ! -f "$f/.env" ]; then
              cp "$f/.env.example" "$f/.env"
            elif [ ! -f "$f/.env" ]; then
              touch "$f/.env"
            fi
          done

      - name: Validate Docker Compose Configuration
        run: docker compose -f infra/docker-compose.yml config --quiet
