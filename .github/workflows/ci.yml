name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  java-services:
    name: Java Services Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile and Test Orchestrator
        run: mvn -B test-compile --file services/orchestrator/pom.xml

      - name: Compile and Test CMS Adapter
        run: mvn -B test-compile --file services/cms-adapter/pom.xml

      - name: Compile and Test Legacy CMS
        run: mvn -B test-compile --file legacy/cms/pom.xml

  python-services:
    name: Python Services Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            services/wms-adapter/app/requirements.txt
            services/ros-integration/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/wms-adapter/app/requirements.txt
          pip install -r services/ros-integration/requirements.txt

      - name: Syntax verification (py_compile)
        run: |
          for dir in services/wms-adapter services/ros-integration legacy/wms legacy/ros; do
            if [ -d "$dir" ]; then
              echo "Validating Python syntax in $dir..."
              python -m compileall "$dir"
            fi
          done

      - name: Run Python unit tests
        env:
          DEDUP_DB_PATH: ':memory:'
        run: |
          if [ -d "services/wms-adapter/test" ]; then
            python -m unittest discover -s services/wms-adapter/test -p "test_*.py"
          fi

  frontend-ui:
    name: Frontend UI Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 with npm caching
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ui/client-portal/package-lock.json
            ui/driver-app/package-lock.json

      - name: Build Client Portal
        working-directory: ui/client-portal
        env:
          CI: false
        run: |
          npm ci
          npm run build

      - name: Build Driver App
        working-directory: ui/driver-app
        env:
          CI: false
        run: |
          npm ci
          npm run build

  docker-compose-check:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose -f infra/docker-compose.yml config --quiet
