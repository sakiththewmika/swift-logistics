services:
  consul:
    image: hashicorp/consul:1.18
    container_name: consul-registry
    restart: unless-stopped
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: ["agent", "-server", "-bootstrap-expect=1", "-ui", "-client=0.0.0.0"]
    networks:
      - swift-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin-tracing
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - swift-network

  # Local MongoDB replica set for transactional application data
  mongo:
    image: mongo:7
    container_name: swift-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - swift-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host localhost:27017 --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }\" | grep -q 1"
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 5s

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: swift-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672" # AMQP port for host-local clients
      - "127.0.0.1:15672:15672" # Management UI for host-local administration
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - swift-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # Swift Logistics Orchestrator
  orchestrator:
    build:
      context: ../services/orchestrator
      dockerfile: Dockerfile
    container_name: swift-orchestrator
    restart: unless-stopped
    ports:
      - "8000:8000" # Application port
    env_file:
      - ../services/orchestrator/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/swift-logic?replicaSet=rs0
      RABBITMQ_HOST: rabbitmq
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - swift-network
    volumes:
      - orchestrator_logs:/app/logs

  # WMS adapter service
  wms-adapter:
    build:
      context: ../services/wms-adapter
      dockerfile: Dockerfile
    container_name: swift-wms-adapter
    restart: unless-stopped
    ports:
      - "8003:8003" # Application port
    env_file:
      - ../services/wms-adapter/app/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      WMS_DEBUG: "false"
      DEDUP_DB_PATH: /app/data/dedup_state.db
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - swift-network
    volumes:
      - wms_dedup_data:/app/data
    
    # ROS integration service
  ros-integration:
    build:
      context: ../services/ros-integration
      dockerfile: Dockerfile
    container_name: swift-ros-integration
    restart: unless-stopped
    ports:
      - "8004:8004" # Application port
    env_file:
      - ../services/ros-integration/.env
    environment:
      ADAPTER_PORT: 8004
      MONGO_URI: mongodb://mongo:27017/swift-logic?replicaSet=rs0
      RABBITMQ_HOST: rabbitmq
      DEDUP_DB_PATH: /app/data/dedup_state.db
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - swift-network
    volumes:
      - ros_dedup_data:/app/data

  cms:
    build:
      context: ../legacy/cms
      dockerfile: Dockerfile
    container_name: cms-mock-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - SERVER_PORT=5001
      - SPRING_APPLICATION_NAME=cms-mock
      - JAVA_OPTS=-Xmx512m -Xms256m
    networks:
        - swift-network
    healthcheck:
      test: ["CMD-SHELL", "grep -Eq '00000000:1389 |:1389 ' /proc/net/tcp /proc/net/tcp6"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  cms-adapter:
    build:
      context: ../services/cms-adapter
      dockerfile: Dockerfile
    container_name: swift-cms-adapter
    restart: unless-stopped
    ports:
      - "8001:8001" # Application port
    env_file:
      - ../services/cms-adapter/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      MONGODB_URI: mongodb://mongo:27017/swift-logic?replicaSet=rs0
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      cms:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - swift-network

  client-portal:
    build:
      context: ../ui/client-portal
      dockerfile: Dockerfile
    container_name: swift-client-portal
    restart: unless-stopped
    ports:
        - "3000:3000" # Application port
    networks:
      - swift-network

  driver-app:
    build:
      context: ../ui/driver-app
      dockerfile: Dockerfile
    container_name: swift-driver-app
    restart: unless-stopped
    ports:
      - "3001:3001" # Application port
    environment:
      REACT_APP_API_BASE_URL: http://localhost:8080/api/v1
      REACT_APP_WS_URL: ws://localhost:8080/ws
    networks:
      - swift-network


# Named volumes for data persistence
volumes:
  mongo_data:
    driver: local
  rabbitmq_data:
    driver: local
  orchestrator_logs:
    driver: local
  wms_dedup_data:
    driver: local
  ros_dedup_data:
    driver: local

# Network for service communication
networks:
  swift-network:
    driver: bridge
