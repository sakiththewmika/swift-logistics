# Hermetic profile for @SpringBootTest: nothing here may reach a real database, broker or registry.
# Values are literals on purpose, so no .env file or environment variable can redirect them.

# MongoDB: an address nothing listens on, with short timeouts so a stray query fails fast.
spring.data.mongodb.uri=mongodb://localhost:1/swift-logic-test?serverSelectionTimeoutMS=500&connectTimeoutMS=500
spring.data.mongodb.auto-index-creation=false
app.seed.enabled=false

# RabbitMQ: no listener containers, no queue declaration, so no connection is ever opened.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=1
spring.rabbitmq.dynamic=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

# Background work and service discovery.
app.outbox.relay.enabled=false
spring.cloud.consul.enabled=false
spring.cloud.consul.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false
management.tracing.enabled=false

# Make the intent obvious in every test run.
app.security.require-jwt=true
