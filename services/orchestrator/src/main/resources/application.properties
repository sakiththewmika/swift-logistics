# -----------------------------
# Server
# -----------------------------
server.port=${SERVER_PORT:8000}
spring.application.name=${APPLICATION_NAME:swift-orchestrator}
spring.cloud.consul.host=${CONSUL_HOST:consul}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s
management.endpoints.web.exposure.include=health,info
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]

# -----------------------------
# MongoDB Configuration
# -----------------------------
spring.data.mongodb.uri=${MONGODB_URI:mongodb://mongo:27017/swift-logic?replicaSet=rs0}
spring.data.mongodb.auto-index-creation=true

# -----------------------------
# RabbitMQ (AMQP)
# -----------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Ensure messages are persistent
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# -----------------------------
# WebSocket / STOMP
# -----------------------------
# (usually no need for much here, configs are done in WebSocketConfig)
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG

server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b

# -----------------------------
# Data Seeder
# -----------------------------
app.seed.enabled=true

# -----------------------------
# Security / CORS
# -----------------------------
# Set REQUIRE_JWT=false only for local experiments; protected routes require a bearer token otherwise.
app.security.require-jwt=${REQUIRE_JWT:true}
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# -----------------------------
# Swagger / OpenAPI 3.0
# -----------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
