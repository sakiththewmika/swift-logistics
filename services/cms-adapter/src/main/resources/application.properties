spring.application.name=cms-adapter
server.port=${SERVER_PORT}
spring.cloud.consul.host=${CONSUL_HOST:consul}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s
management.endpoints.web.exposure.include=health,info
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

resilience4j.circuitbreaker.instances.cmsSoapBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.cmsSoapBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.cmsSoapBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.cmsSoapBreaker.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.cmsSoapBreaker.permittedNumberOfCallsInHalfOpenState=2
resilience4j.timelimiter.instances.cmsSoapBreaker.timeoutDuration=4s