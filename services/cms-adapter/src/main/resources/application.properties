spring.application.name=cms-adapter
server.port=${SERVER_PORT}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

resilience4j.circuitbreaker.instances.cmsSoapBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.cmsSoapBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.cmsSoapBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.cmsSoapBreaker.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.cmsSoapBreaker.permittedNumberOfCallsInHalfOpenState=2
resilience4j.timelimiter.instances.cmsSoapBreaker.timeoutDuration=4s